name: probability-lab-tests
on:
  push:
    paths: ["02-probability-simulation-laboratory/**"]
  pull_request:
    paths: ["02-probability-simulation-laboratory/**"]
jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-probability-simulation-laboratory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
